name: graph_auth_mobile
description: "A Flutter mobile application that implements OTP-based authentication using phone number login and displays user profile data via GraphQL API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # di
  get_it: ^9.2.0
  # equatable
  equatable: ^2.0.5
  # state manager
  flutter_bloc: ^9.1.1
  # hive
  hive: ^2.2.3
  # path
  path_provider: ^2.1.3
  # rest api
  dio: ^5.4.3+1
  dio_retry_plus: ^2.0.7
  # chuck
  chuck_interceptor: ^2.1.6
  # box
  gap: ^3.0.1
  # router
  go_router: ^17.1.0
  # svg
  flutter_svg: ^2.0.10+1
  # url launchers
  url_launcher: ^6.2.6
  # otp autofill
  otp_autofill_plus: ^1.0.5
  # sms autofill
  pin_input_text_field: ^4.5.1
  # package info
  package_info_plus: ^9.0.0
  # cached network image
  cached_network_image: ^3.3.1
  ferry: ^0.16.2-dev.4
  gql_http_link: ^1.2.0
  gql_code_builder_serializers: ^0.1.0+1
  gql_transform_link: ^1.0.1


dev_dependencies:
  build_runner: ^2.11.1
  ferry_generator: ^0.14.0-dev.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


flutter:

  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/locale/
    - assets/images/

  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
