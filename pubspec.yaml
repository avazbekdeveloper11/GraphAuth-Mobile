name: graph_auth_mobile
description: "A Flutter mobile application that implements OTP-based authentication using phone number login and displays user profile data via GraphQL API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^9.2.0
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  path_provider: ^2.1.3
  gap: ^3.0.1
  go_router: ^17.1.0
  package_info_plus: ^9.0.0
  cached_network_image: ^3.3.1
  ferry: ^0.16.2-dev.4
  gql_http_link: ^1.2.0
  gql_code_builder_serializers: ^0.1.0+1
  gql_transform_link: ^1.0.1
  dio: ^5.9.1


dev_dependencies:
  build_runner: ^2.11.1
  ferry_generator: ^0.14.0-dev.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


flutter:

  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/locale/
    - assets/images/

  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
